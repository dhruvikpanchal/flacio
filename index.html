<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Flacio - Premium indoor plants, office plant styling, and botanical collections delivered to your door."
    />
    <meta name="theme-color" content="#224229" />
    <title>flacio - Modern Plant Store & Styling</title>
    <!-- Preload critical fonts for instant rendering & 0 layout shift -->
    <link
      rel="preload"
      href="/fonts/libre-baskerville/libre-baskerville-v24-latin-italic-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/libre-baskerville/libre-baskerville-v24-latin-regular-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins/poppins-v24-latin-regular-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      *:not(html):not(body)::-webkit-scrollbar {
        width: 6px;
        height: 6px;
        background: transparent !important;
      }
      *:not(html):not(body)::-webkit-scrollbar-track,
      *:not(html):not(body)::-webkit-scrollbar-track-piece,
      *:not(html):not(body)::-webkit-scrollbar-corner {
        background: transparent !important;
        border: none !important;
      }
      *:not(html):not(body)::-webkit-scrollbar-button {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      *:not(html):not(body)::-webkit-scrollbar-thumb {
        background-color: rgba(31, 32, 36, 0.28) !important;
        border-radius: 9999px !important;
        border: 1px solid transparent !important;
        background-clip: padding-box !important;
      }
      *:not(html):not(body)::-webkit-scrollbar-thumb:hover {
        background-color: rgba(34, 66, 41, 0.65) !important;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 200ms ease-out;
        pointer-events: none;
        border: 0;
        outline: 0;
      }
      .boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #224229;
        border-radius: 50%;
        will-change: transform;
        transform: translateZ(0);
        animation: boot-spin 0.75s linear infinite;
      }
      .boot-text {
        margin-top: 14px;
        font-size: 14px;
        font-weight: 500;
        color: #313232;
        letter-spacing: 0.02em;
        border: 0;
        outline: 0;
        user-select: none;
      }
      @keyframes boot-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Startup boot loader (single loader, GPU transform rotate) -->
    <div id="boot-loader">
      <div class="boot-spinner"></div>
      <p class="boot-text">Loading Flacio...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
